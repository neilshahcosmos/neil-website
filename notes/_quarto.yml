project:
  type: website
  # Rendered into ../dist/notes so the site is served at neilshahcosmos.com/notes/.
  # The main site at the root of the domain lives in ../home (see netlify-build.sh).
  output-dir: ../dist/notes
  resources:
    - assets/images/**
  # Note: the book lives in _book/ as its own Quarto project. Directories that
  # start with "_" are ignored by this project, so it is rendered separately
  # (see netlify-build.sh / publish.sh) into ../dist/notes/book/.

website:
  title: "Neil Shah"
  description: "Notes on mathematics and physics — algebra, Lie theory, and the road to quantum field theory."
  site-url: https://neilshahcosmos.com/notes
  favicon: assets/favicon.svg
  search:
    location: navbar
    type: overlay
  navbar:
    background: "#0d0b24"   # deep-space navy to match the banners (was: primary)
    foreground: "#e8e6ff"
    pinned: true
    left:
      - text: "Notes"
        menu:
          - text: "Set Theory"
            href: set-theory/index.qmd
          - text: "Algebra"
            href: algebra/index.qmd
          - text: "Lie Theory"
            href: lie-theory/index.qmd
          - text: "Quantum Field Theory"
            href: qft/index.qmd
      - text: "Book"
        href: book/index.html
      - text: "About"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/neilshahcosmos
        aria-label: GitHub
  page-footer:
    left: "© Neil Shah · Notes licensed [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)"
    right: "Built with [Quarto](https://quarto.org)"
  page-navigation: true
  back-to-top-navigation: true

format:
  html:
    theme:
      light: [litera, theme.scss]
      dark: [darkly, theme.scss]
    css: styles.css
    toc: true
    toc-depth: 3
    toc-location: right
    number-sections: false
    html-math-method: mathjax
    include-before-body: _macros.html
    code-copy: true
    link-external-newwindow: true
    smooth-scroll: true
    fig-cap-location: bottom
    # Space-art banner behind each page's title block. Section folders override
    # this in their _metadata.yml; any page can override it in its front matter
    # with `title-block-banner: ../assets/images/banners/<file>.jpg` (or `false`).
    title-block-banner: assets/images/banner.jpg
    title-block-banner-color: "#ffffff"

# Theorem-style environments and cross-references work out of the box:
#   ::: {#thm-schur}            -> Theorem 1 ... referenced with @thm-schur
#   ::: {#def-group}            -> Definition
#   ::: {#lem-...} {#prp-...} {#cor-...} {#exm-...} {#exr-...}
#   ::: {.proof}                -> Proof. ... ∎
#   $$ ... $$ {#eq-noether}     -> numbered equation, referenced with @eq-noether
crossref:
  eq-prefix: "Eq."

# Shared bibliography. Cite with [@georgi1999] etc.; a "References" section
# is appended automatically to any page that cites something.
bibliography: references.bib
